<!doctype html>
<html lang="en-CA" prefix="og: http://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Preloaded, not merely declared: the name at the top of this page is the site's first
      impression, and a face that arrives after first paint re-lays out every block under it.
      `@font-face` lives in src/styles/fonts.css.
    -->
    <link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist-mono.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      This head is the whole page as far as a link scraper is concerned: `#root` is empty until the
      bundle runs, and Slack, LinkedIn, X and iMessage do not run it. So the four strings below are
      the same four the application renders — `seo.home.*` in `src/i18n/translations/en/common.json`
      — and `yarn check:head` fails when they drift apart, which is how they came to disagree in the
      first place.
    -->
    <title>Francis Desjardins — framework-free cores, nothing shipped with them</title>
    <meta
      name="description"
      content="Framework-free cores with thin bindings over them: the core is plain TypeScript that runs in a browser, a worker or a service, and the binding is the only part that knows which. Three libraries, no runtime dependencies between them."
    />
    <meta
      name="keywords"
      content="Francis Desjardins, framework-agnostic, headless libraries, zero dependencies, bootstrap orchestration, dependency graph, concurrency, cancellation, design tokens, dialog manager, TypeScript, React, Solid, Node, Quebec"
    />
    <meta name="author" content="Francis Desjardins" />
    <meta name="robots" content="index, follow" />
    <!-- --app-primary, light scheme. `yarn check:literals` holds it to the token sheet. -->
    <meta name="theme-color" content="#c13584" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://francisdesjardins.ca/" />
    <meta
      property="og:title"
      content="Francis Desjardins — framework-free cores, nothing shipped with them"
    />
    <meta
      property="og:description"
      content="A dependency is easy to add and hard to remove, and most of what one does goes unused. Three libraries that ship none, and the measured reason why."
    />
    <meta property="og:image" content="https://francisdesjardins.ca/og-image.png" />
    <meta property="og:site_name" content="Francis Desjardins" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://francisdesjardins.ca/" />
    <meta
      name="twitter:title"
      content="Francis Desjardins — framework-free cores, nothing shipped with them"
    />
    <meta
      name="twitter:description"
      content="A dependency is easy to add and hard to remove, and most of what one does goes unused. Three libraries that ship none, and the measured reason why."
    />
    <meta name="twitter:image" content="https://francisdesjardins.ca/og-image.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://francisdesjardins.ca/" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Additional SEO -->
    <meta name="geo.region" content="CA-QC" />
    <meta name="geo.country" content="CA" />

    <!--
      Structured data. The person, then the three pieces as their own nodes, each pointing at the
      surface a reader can actually open — a `codeRepository` would be the obvious field and is
      deliberately absent until the repository is public, a 404 being worse than a gap.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://francisdesjardins.ca/#person",
            "name": "Francis Desjardins",
            "description": "Builds the blocks other software is built from: framework-free cores with thin bindings over them, the core plain TypeScript that runs in a browser, a worker or a service. Asks how much of a dependency is actually used before adding it, and writes down what a library refuses to do before what it does.",
            "url": "https://francisdesjardins.ca",
            "sameAs": ["https://github.com/francisdesjardins"],
            "knowsAbout": [
              "Software architecture",
              "Bootstrap orchestration",
              "Dependency graphs",
              "Concurrency and cancellation",
              "Framework-agnostic library design",
              "TypeScript",
              "Node.js",
              "React",
              "Solid",
              "Design tokens",
              "Accessibility",
              "Performance engineering",
              "Developer experience"
            ],
            "address": {
              "@type": "PostalAddress",
              "addressRegion": "QC",
              "addressCountry": "CA"
            }
          },
          {
            "@type": "SoftwareSourceCode",
            "name": "umbra",
            "author": { "@id": "https://francisdesjardins.ca/#person" },
            "url": "https://francisdesjardins.ca/playground/boot/",
            "programmingLanguage": "TypeScript",
            "runtimePlatform": ["Browser", "Node.js", "Web Worker"],
            "description": "Bootstrap orchestration over a declared step graph. The core needs no DOM, so one graph boots a page, a worker or a service; parallelism is derived from what each step declares it needs rather than configured."
          },
          {
            "@type": "SoftwareSourceCode",
            "name": "antumbra",
            "author": { "@id": "https://francisdesjardins.ca/#person" },
            "url": "https://francisdesjardins.ca/playground/dialog/",
            "programmingLanguage": "TypeScript",
            "runtimePlatform": "Browser",
            "description": "A headless dialog manager on the native top layer. The framework-agnostic core owns the stack, the focus and the scroll lock; React, Solid and vanilla bindings do the rendering, and no UI ships."
          },
          {
            "@type": "SoftwareSourceCode",
            "name": "penumbra",
            "author": { "@id": "https://francisdesjardins.ca/#person" },
            "url": "https://francisdesjardins.ca/playground/design/",
            "programmingLanguage": "CSS",
            "description": "The portable half of a design system: a scale with no colour in it, a neutral palette with no brand in it, and a contrast gate over both."
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

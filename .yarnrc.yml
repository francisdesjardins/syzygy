# The release is vendored rather than resolved from the machine: Node 26 unbundled Corepack, so
# `yarn` on PATH here is a 1.22 that refuses to run a project declaring yarn@4. `yarnPath` makes
# every `yarn` in this repo run the file below, whatever is installed globally.
nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.18.0.cjs

# Hoisting is limited per package, in each package's own `installConfig` rather than here — see
# packages/*/package.json. A project-wide limit was the first thing tried and it was wrong: it
# gives a package and its playground one copy of Vite each, and the playground's vite.config.ts
# takes a plugin from the package, so two structurally identical Plugin types meet and the build
# stops type-checking. The boundary has to be the package, not the workspace.

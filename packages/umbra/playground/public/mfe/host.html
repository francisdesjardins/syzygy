<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>umbra — one page, four fragments</title>
    <!-- The playground's own icon. Named explicitly because this page is loaded in a frame and a
         guessed `/favicon.ico` would 404 into the parent's console — where the smoke test reads. -->
    <link rel="icon" href="../favicon.svg" />

    <!--
      The host's entire job: name the shared modules and hand the same ones to everybody.

      Three fragments resolve `umbra` to one build. The fourth resolves `umbra-copy` to a
      second, separately built copy of the same library — its own module instance, its own closures.
      It still adopts the work the others did, because shared scope lives in a registry keyed by `Symbol.for`
      on `globalThis` rather than by module identity. A library whose sharing is a module singleton
      cannot do that, and fails silently when a host forgets to deduplicate it.

      No bundler runs on this page. The browser resolves the map.
    -->
    <script type="importmap">
      {
        "imports": {
          "umbra": "./umbra.mjs",
          "umbra/react": "./umbra-react.mjs",
          "umbra/solid": "./umbra-solid.mjs",
          "umbra/plain": "./umbra-plain.mjs",
          "umbra-copy": "./umbra-copy.mjs",
          "react": "./react.mjs",
          "react-dom/client": "./react-dom-client.mjs",
          "solid-js": "./solid-js.mjs",
          "solid-js/web": "./solid-js-web.mjs",
          "solid-js/h": "./solid-js-h.mjs"
        }
      }
    </script>

    <style>
      :root {
        color-scheme: light dark;
        --bg: light-dark(#f8fafc, #0b1120);
        --panel: light-dark(#ffffff, #131c2e);
        --ink: light-dark(#0f172a, #e2e8f0);
        --muted: light-dark(#64748b, #94a3b8);
        --line: light-dark(#e2e8f0, #24314a);
        --accent: light-dark(#3b5bdb, #748ffc);
        --ok: light-dark(#15803d, #4ade80);
        --warn: light-dark(#b45309, #fbbf24);
        --error: light-dark(#b91c1c, #f87171);
        /* One colour per fragment, so a badge, a log line and a panel border agree about who. */
        --topbar: light-dark(#0d9488, #2dd4bf);
        --nav: light-dark(#7c3aed, #a78bfa);
        --list: light-dark(#b45309, #f59e0b);
        --trial: light-dark(#be123c, #fb7185);
      }
      :root[data-theme='light'] {
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }
      /* The frame is a fixed viewport on a desktop, not a page that grows into one.
         It was the second: every fragment that rendered and every line the log added made the
         document taller, the host measured it, and the site shifted under the reader four times in
         two seconds — 205px of it. Here the page is exactly the height it was given, the log
         scrolls inside its own panel, and nothing outside moves. Below 820px the columns stack and
         the page is honestly taller than any fixed height, so it goes back to growing. */
      html {
        height: 100%;
      }
      body {
        height: 100%;
        box-sizing: border-box;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        overflow: hidden;
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          13px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      code,
      .mono {
        font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, monospace;
      }

      /* The log is a column, not a band underneath. As a band it added its own height to a frame
         whose height is the page's problem — the reader scrolls the site to see a demo that is
         already showing everything. Beside the fragments it costs nothing: the row is as tall as
         the panels were going to be anyway. Three sevenths of what the two content columns share, which lands on a third of the frame, because
         its lines are long and wrapping them is what made it hard to read in the first place. */
      .shell {
        min-height: 0;
        display: grid;
        grid-template-columns: 190px minmax(0, 4fr) minmax(0, 3fr);
        grid-template-rows: auto minmax(0, 1fr);
        grid-template-areas: 'top top top' 'nav main log';
        gap: 10px;
        padding: 10px;
      }
      @media (max-width: 820px) {
        html,
        body {
          height: auto;
          overflow: visible;
        }
        .shell {
          grid-template-columns: minmax(0, 1fr);
          grid-template-areas: 'top' 'nav' 'main' 'log';
        }
        .main {
          overflow: visible;
        }
        .log {
          height: auto;
          max-height: 170px;
        }
      }

      .frag {
        background: var(--panel);
        border: 1px solid var(--line);
        border-top: 3px solid var(--own, var(--line));
        border-radius: 8px;
        padding: 10px 12px;
        min-height: 64px;
      }
      #topbar {
        grid-area: top;
        --own: var(--topbar);
      }
      #nav {
        grid-area: nav;
        --own: var(--nav);
      }
      .main {
        grid-area: main;
        display: grid;
        /* The list takes what it needs and the panel under it takes the rest, so the three columns
           end on one line instead of the middle one stopping wherever its content did. */
        grid-template-rows: auto minmax(0, 1fr);
        gap: 10px;
        min-height: 0;
        overflow: hidden;
      }
      #list {
        --own: var(--list);
      }
      #trial {
        --own: var(--trial);
      }

      .frag-name {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--own, var(--muted));
        font-weight: 700;
        margin-bottom: 6px;
      }
      .frag-name span {
        color: var(--muted);
        font-weight: 400;
        text-transform: none;
        letter-spacing: 0;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 8px;
      }
      .chip {
        font-size: 10.5px;
        padding: 1px 7px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .chip-ran {
        border-color: var(--ok);
        color: var(--ok);
      }
      .chip-adopted {
        border-color: var(--accent);
        color: var(--accent);
      }
      /* The step that refused. Solid rather than faded: it is the one to look at, not one of the
         ones it stopped. */
      .chip-blocked {
        border-color: var(--error);
        color: var(--error);
      }
      .chip-skipped,
      .chip-cancelled {
        opacity: 0.6;
      }
      /* The step's own words for why, which is the only thing separating the one that decided from
         the ones wearing the same status behind it. */
      .chip-why {
        border-color: transparent;
        font-style: italic;
      }

      .refused {
        margin-top: 6px;
        color: var(--error);
      }

      ul {
        margin: 6px 0 0;
        padding-left: 18px;
      }
      li {
        margin: 2px 0;
      }

      .counter {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        align-items: baseline;
        padding: 10px 12px;
        margin: 10px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .counter strong {
        font-size: 22px;
        font-variant-numeric: tabular-nums;
      }
      .counter .expect {
        width: 100%;
        color: var(--muted);
      }
      .counter .expect b {
        color: var(--ink);
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        margin: 0 10px 10px;
        color: var(--muted);
        font-size: 11.5px;
      }
      .counter a {
        color: var(--accent);
      }

      .log {
        grid-area: log;
        margin: 0;
        padding: 10px 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        /* Its cell, in full, whatever it holds: a log that sized itself is a log that resizes the
           page under the reader. It scrolls; the last line is the one that matters. */
        min-height: 0;
        height: 100%;
        overflow-y: auto;
      }
      .log {
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
        scrollbar-gutter: stable;
      }
      .log::-webkit-scrollbar {
        width: 10px;
      }
      .log::-webkit-scrollbar-track {
        background: transparent;
      }
      .log::-webkit-scrollbar-thumb {
        background: var(--line);
        border: 3px solid transparent;
        border-radius: 999px;
        background-clip: padding-box;
      }
      .log::-webkit-scrollbar-thumb:hover {
        background: var(--muted);
        background-clip: padding-box;
      }
      .log p {
        margin: 1px 0;
        font-size: 11.5px;
      }
      .log .who {
        font-weight: 700;
      }

      dialog {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        color: var(--ink);
        padding: 18px 20px;
        max-width: 380px;
      }
      dialog::backdrop {
        background: rgb(0 0 0 / 40%);
      }
      button {
        font: inherit;
        padding: 5px 12px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
    </style>
  </head>

  <body>
    <div class="counter">
      <span>Requests these four fragments actually sent:</span>
      <strong id="calls">0</strong>
      <span class="expect" id="scope-note"></span>
    </div>

    <div class="legend">
      <span><span class="chip chip-ran">step · ran it</span> this fragment did the work</span>
      <span
        ><span class="chip chip-adopted">step · adopted</span> another fragment had already done it,
        and this one took the answer</span
      >
      <span
        ><span class="chip chip-blocked">step · blocked</span> it refused the mount, and the chip
        beside it is the reason it gave</span
      >
    </div>

    <div class="shell">
      <header class="frag" id="topbar"></header>
      <aside class="frag" id="nav"></aside>
      <div class="main">
        <section class="frag" id="list"></section>
        <trial-panel id="trial" class="frag"></trial-panel>
      </div>
      <div class="log" id="log"></div>
    </div>

    <dialog id="warn">
      <h3 style="margin-top: 0">The app is asking</h3>
      <p id="warn-message"></p>
      <div style="display: flex; justify-content: flex-end; gap: 8px">
        <button id="warn-no">Not now</button>
        <button id="warn-yes" class="primary">Acknowledge</button>
      </div>
    </dialog>

    <script>
      /*
       * The page's own plumbing, shared by all four fragments because they share a document.
       *
       * `api` is here rather than in each fragment so the counter is honest: it counts calls that
       * actually left, which is the only number that says whether shared scope did anything.
       */
      const params = new URLSearchParams(location.search);
      const scope = params.get('scope') === 'instance' ? 'instance' : 'shared';
      const signedIn = params.get('session') !== 'none';
      const preview = params.get('preview') === 'on';
      const accessHangs = params.get('access') === 'hang';

      let calls = 0;
      /**
       * Counted when the request goes out, not when it comes back.
       *
       * The label says "actually sent", and one of the switches below makes a call that never
       * returns — counting on the way back would quietly credit sharing for a request that left.
       */
      const sent = () => {
        calls += 1;
        document.getElementById('calls').textContent = String(calls);
      };

      const wait = (ms) => {
        return new Promise((resolve) => {
          setTimeout(resolve, ms);
        });
      };

      window.demo = {
        scope,
        preview,

        api: {
          async session() {
            sent();
            await wait(340);
            // Whether it came back with a session is a different question from whether it was sent.
            return signedIn ? { userId: 'u-4821', displayName: 'F. Desjardins' } : null;
          },
          async access() {
            sent();
            if (accessHangs) {
              // Never resolves, and never looks at the signal either. The step's own timeout is
              // what ends it, which is the ending the owner's body never sees.
              return new Promise(() => {});
            }
            await wait(260);
            return ['projects:read', 'tags:read', 'reports:read'];
          },
          async config() {
            sent();
            await wait(400);
            return { workspaceName: 'Acme Workspace', trialDaysLeft: 12 };
          },
          async projects() {
            sent();
            await wait(300);
            return ['Atlas migration', 'Billing rewrite', 'Search index'];
          },
          async diagnostics() {
            sent();
            await wait(220);
            return { recording: 'dbg-7c1f' };
          },
        },

        log(who, message) {
          const line = document.createElement('p');
          const tag = document.createElement('span');
          tag.className = 'who';
          tag.style.color = `var(--${who})`;
          tag.textContent = `${who} `;
          line.append(tag, document.createTextNode(message));
          document.getElementById('log').append(line);
        },

        /**
         * One chip per step: what became of it, and whether this fragment did the work.
         *
         * `chipsOf` is the shape, and the React fragment rebuilds it with `createElement` because
         * React cannot render a DOM node handed to it. Two spellings of one row, so they read off
         * the same function rather than each deciding what a chip says.
         */
        chipsOf(outcome) {
          return outcome.timeline.flatMap((trace) => {
            const adopted = trace.shared === true;
            // Two facts, and they are not the same one: what became of the step, and who did the
            // work. Sharing is this page's subject, so a plain success says only that; anything
            // else leads with the word for how it ended, because that is the surprise.
            const said =
              trace.status === 'success'
                ? adopted
                  ? 'adopted'
                  : 'ran it'
                : adopted
                  ? `${trace.status}, adopted`
                  : trace.status;
            const kind = trace.status === 'success' ? (adopted ? 'adopted' : 'ran') : trace.status;
            const chips = [{ key: trace.id, kind, text: `${trace.id} · ${said}` }];
            if (trace.reason !== undefined) {
              chips.push({ key: `${trace.id}:why`, kind: 'why', text: trace.reason });
            }
            return chips;
          });
        },

        chips(outcome) {
          const row = document.createElement('div');
          row.className = 'chips';
          for (const chip of demo.chipsOf(outcome)) {
            const node = document.createElement('span');
            node.className = `chip chip-${chip.kind}`;
            node.textContent = chip.text;
            row.append(node);
          }
          return row;
        },

        /**
         * What a fragment says instead of its content, or `undefined` when it has content to show.
         *
         * `ready` and `degraded` both mount — that is what separates a boot that lost something
         * optional from one that has nowhere to go. Everything else replaces the fragment, and says
         * which step decided: the one wearing `blocked` chose, and the rest carry the word because
         * they were stopped behind it.
         *
         * `verdictOf` is the sentence and `verdict` is the node, for the same reason `chipsOf` is
         * split from `chips`: the React fragment cannot be handed a node.
         */
        verdictOf(outcome) {
          if (outcome.status === 'ready' || outcome.status === 'degraded') {
            return undefined;
          }
          const decided = outcome.timeline.find((trace) => {
            return trace.status === 'blocked';
          });
          if (decided !== undefined) {
            return `Refused by ${decided.id}: ${decided.reason ?? 'no reason given'}`;
          }
          const failure = outcome.errors[0];
          return failure === undefined
            ? `Did not start: ${outcome.status}.`
            : `Did not start: ${failure.step} ${failure.status}.`;
        },

        verdict(outcome) {
          const line = document.createElement('div');
          line.className = 'refused';
          line.textContent = demo.verdictOf(outcome);
          return line;
        },

        header(name, framework) {
          const head = document.createElement('div');
          head.className = 'frag-name';
          head.append(document.createTextNode(`${name} `));
          const note = document.createElement('span');
          note.textContent = framework;
          head.append(note);
          return head;
        },

        /** The page's one dialog. Whichever fragment holds the intent drives it. */
        ask(message) {
          const dialog = document.getElementById('warn');
          document.getElementById('warn-message').textContent = message;
          dialog.showModal();
          return new Promise((resolve) => {
            // Escape closes a native dialog on its own, through neither button. Without this the
            // promise never settles, the intent stays forwarded, and the step waiting on it waits
            // for the rest of the session — the failure looks like nothing happening at all.
            // Closing the question without answering it is a refusal, same as the other button.
            const cancelled = () => {
              resolve(false);
            };
            dialog.addEventListener('close', cancelled, { once: true });

            const done = (answer) => {
              dialog.removeEventListener('close', cancelled);
              dialog.close();
              resolve(answer);
            };
            document.getElementById('warn-yes').onclick = () => {
              return done(true);
            };
            document.getElementById('warn-no').onclick = () => {
              return done(false);
            };
          });
        },
      };

      /*
       * What the page needs in each mode, counted from the fragments themselves.
       *
       * The four declare eight steps between them: the top bar needs the session; navigation needs
       * the session and access; the list needs those two plus its own reference data; the trial
       * panel needs the session and the configuration. Sharing what is the same answer for everybody
       * leaves four distinct pieces of work.
       *
       * With no session nothing downstream of it runs, so the count is the session calls alone —
       * one when it is shared, one per fragment when it is not. That is the refusal being adopted,
       * in the only number on the page that cannot be talked into agreeing.
       */
      /**
       * Added up from who declares what, rather than kept as a table somebody has to remember to
       * update. Four switches make sixteen states, and a hand-written number for each is how a demo
       * comes to claim a total it stopped producing — which this one did, twice, before this.
       *
       * Shared means one call per step whatever the fragments; instance means one per fragment that
       * declared it. The session is declared by all four, `access` by navigation and the list,
       * `config` by the trial panel alone, `projects:reference` by the list and never shared.
       */
      const expectedFor = (mode) => {
        // Nothing downstream of a refused session runs, so the count is the session calls alone.
        if (!signedIn) {
          return mode === 'shared' ? 1 : 4;
        }
        const perStep = (declarers) => {
          return mode === 'shared' ? 1 : declarers;
        };
        return (
          perStep(4) + // session
          perStep(2) + // access
          perStep(1) + // config
          (accessHangs ? 0 : 1) + // projects:reference — pruned when access never answers
          (preview ? perStep(4) : 0) // diagnostics — skipped when this is not a preview build
        );
      };
      const EXPECTED = { shared: expectedFor('shared'), instance: expectedFor('instance') };

      /*
       * The link back out, rebuilt from the page above rather than written down.
       *
       * This frame is served from the parent's own folder, but it cannot assume what that folder is:
       * the playground sits at the root in dev and under /playground/boot/ on the site, and the
       * deployed build routes in the hash while dev routes on the path. The parent URL already
       * carries both answers — keep all of it and swap the one parameter.
       */
      const hrefWith = (name, next) => {
        const url = new URL(parent.location.href);
        if (url.hash.startsWith('#/')) {
          const [path, query] = url.hash.slice(1).split('?');
          const params = new URLSearchParams(query ?? '');
          params.set(name, next);
          url.hash = `#${path}?${params.toString()}`;
        } else {
          url.searchParams.set(name, next);
        }
        return url.href;
      };

      const expected = EXPECTED;
      const note = document.getElementById('scope-note');
      note.innerHTML = signedIn
        ? scope === 'shared'
          ? `Shared, so the four of them do <b>${expected.shared}</b> pieces of work instead of <b>${expected.instance}</b>. <a href="${hrefWith('scope', 'instance')}" target="_parent">See it without sharing</a>.`
          : `Each fragment does its own: <b>${expected.instance}</b> pieces of work instead of <b>${expected.shared}</b>. <a href="${hrefWith('scope', 'shared')}" target="_parent">Turn sharing back on</a>.`
        : scope === 'shared'
          ? `No session: <b>${expected.shared}</b> request, and the other three adopted the refusal rather than asking again. <a href="${hrefWith('scope', 'instance')}" target="_parent">See the same refusal four times</a>.`
          : `No session, found out four times over: <b>${expected.instance}</b> requests for one answer. <a href="${hrefWith('scope', 'shared')}" target="_parent">Share the step</a> and it is asked once.`;
    </script>

    <script type="module" src="./frag-topbar.js"></script>
    <script type="module" src="./frag-nav.js"></script>
    <script type="module" src="./frag-list.js"></script>
    <script type="module" src="./frag-trial.js"></script>
  </body>
</html>
